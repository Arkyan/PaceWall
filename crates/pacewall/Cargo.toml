[package]
name = "pacewall"
version.workspace = true
edition = "2021"
description = "PaceWall : overlays de course natifs pour Le Mans Ultimate"

[dependencies]
fakegame = { path = "../fakegame" }
pwcore = { path = "../pwcore" }
server = { path = "../server" }
lmu = { path = "../lmu" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui_plot = "0.37"
serde_json = "1"
tiny-skia = "0.11"
ab_glyph = "0.2"
tray-icon = "0.26"
global-hotkey = "0.8"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
winreg = "0.56"
sha2 = "0.10"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_Speech",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_Urlmon",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_Controls_Dialogs",
  "Win32_System_Time",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
