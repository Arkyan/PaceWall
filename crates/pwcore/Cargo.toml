[package]
name = "pwcore"
version = "0.1.0"
edition = "2021"
description = "Cœur de PaceWall : lecture du jeu, stratégie, historique, réglages, mises en page"

[dependencies]
lmu = { path = "../lmu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
