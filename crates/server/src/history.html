<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaceWall · Historique</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e9ef; --muted:#8b93a3;
    --accent:#ff7a1a; --ok:#3ecf8e; --bad:#ef5350; --blue:#4f9dff; --sel:rgba(255,122,26,.12);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --panel:#fff; --line:#dfe3ea; --text:#1b1f27; --muted:#6a7282; --sel:rgba(255,122,26,.12); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,Segoe UI,sans-serif; }
  header { border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 8px 0 0; } h1 b { color:var(--accent); }
  nav a { color:var(--muted); text-decoration:none; margin-right:14px; padding-bottom:3px; }
  nav a.on { color:var(--text); border-bottom:2px solid var(--accent); }
  .layout { display:grid; grid-template-columns:300px 1fr; gap:16px; padding:16px; max-width:1300px; margin:0 auto; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .list { max-height:calc(100vh - 110px); overflow:auto; }
  .item { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:last-child { border-bottom:0; }
  .item:hover { background:var(--sel); } .item.on { background:var(--sel); box-shadow:inset 3px 0 var(--accent); }
  .item b { display:block; } .item small { color:var(--muted); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
  .card { padding:10px 14px; } .card small { color:var(--muted); display:block; }
  .card b { font-size:20px; font-variant-numeric:tabular-nums; } .card b em { font-size:12px; color:var(--muted); font-style:normal; font-weight:400; }
  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-bottom:14px; }
  .chart { padding:10px 12px; } .chart h3 { margin:0 0 6px; font-size:13px; color:var(--muted); font-weight:600; }
  svg { width:100%; height:150px; display:block; }
  svg text { fill:var(--muted); font-size:10px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:6px 10px; text-align:right; border-top:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; border-top:0; position:sticky; top:0; background:var(--panel); }
  th:first-child, td:first-child { text-align:left; }
  .tablewrap { overflow:auto; max-height:420px; }
  tr.best td { color:var(--ok); font-weight:600; } tr.dim td { color:var(--muted); }
  .tag { font-size:11px; border:1px solid var(--line); border-radius:99px; padding:0 7px; margin-left:4px; color:var(--muted); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .top h2 { margin:0; font-size:18px; } .top small { color:var(--muted); }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--bad); color:var(--bad); }
  .empty { color:var(--muted); text-align:center; padding:60px 20px; }
</style>
</head>
<body>
<header>
  <h1>Pace<b>Wall</b></h1>
  <nav><a href="/">Données en direct</a><a href="/history" class="on">Historique</a></nav>
</header>
<div class="layout">
  <aside class="panel list" id="list"><div class="empty">Chargement…</div></aside>
  <section id="detail"><div class="empty panel">Choisis une session à gauche.</div></section>
</div>

<script>
const SESSION = { 0:'Test', 1:'Essais libres', 2:'Essais libres', 3:'Essais libres', 4:'Essais libres',
  5:'Qualifications', 6:'Qualifications', 7:'Qualifications', 8:'Qualifications', 9:'Warm-up',
  10:'Course', 11:'Course', 12:'Course', 13:'Course' };
const $ = id => document.getElementById(id);
let current = null;

const lapTime = s => { if (s == null) return '—'; const m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(3).padStart(6, '0'); };
const num = (v, d = 1) => v == null ? '—' : v.toFixed(d);
const day = t => new Date(t * 1000).toLocaleString('fr-FR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
const dur = (a, b) => { if (!b) return 'en cours'; const m = Math.round((b - a) / 60); return m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') : m + ' min'; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

async function loadList() {
  const res = await fetch('/api/sessions');
  const list = $('list');
  if (!res.ok) { list.innerHTML = '<div class="empty">Historique indisponible (base inaccessible).</div>'; return; }
  const sessions = await res.json();
  if (!sessions.length) { list.innerHTML = '<div class="empty">Aucune session enregistrée.<br><small>Les tours s\'enregistrent automatiquement pendant que le serveur tourne.</small></div>'; return; }
  list.innerHTML = '';
  for (const s of sessions) {
    const d = document.createElement('div');
    d.className = 'item' + (s.id === current ? ' on' : '');
    d.innerHTML = '<b></b><small></small>';
    d.children[0].textContent = s.track;
    d.children[1].textContent = (SESSION[s.type] || 'Session') + ' · ' + s.car + ' · ' + s.laps + ' tours' + (s.best ? ' · ' + lapTime(s.best) : '') + ' · ' + day(s.started);
    d.onclick = () => open(s);
    list.appendChild(d);
  }
}

async function open(s) {
  current = s.id;
  document.querySelectorAll('.item').forEach(i => i.classList.remove('on'));
  const laps = await (await fetch('/api/sessions/' + s.id + '/laps')).json();
  render(s, laps);
  loadList();
}

function card(label, value, unit) {
  return '<div class="panel card"><small>' + label + '</small><b>' + value + (unit ? ' <em>' + unit + '</em>' : '') + '</b></div>';
}

function render(s, laps) {
  const clean = laps.filter(l => l.valid && !l.pit);
  const best = clean.length ? Math.min(...clean.map(l => l.time)) : null;
  const mean = avg(clean.map(l => l.time));
  const sd = clean.length > 1 ? Math.sqrt(avg(clean.map(l => (l.time - mean) ** 2))) : null;
  const fuel = avg(laps.map(l => l.fuel).filter(v => v != null));
  const energy = avg(laps.map(l => l.energy).filter(v => v != null));
  const wear = avg(laps.map(l => l.wear).filter(v => v != null));

  const rows = laps.map(l => {
    const cls = l.time === best && l.valid && !l.pit ? 'best' : (!l.valid || l.pit ? 'dim' : '');
    const tags = (l.pit ? '<span class="tag">stand</span>' : '') + (!l.valid ? '<span class="tag">invalide</span>' : '');
    return '<tr class="' + cls + '"><td>' + l.lap + tags + '</td><td>' + lapTime(l.time) + '</td><td>' + num(l.fuel, 2) +
      '</td><td>' + num(l.energy, 1) + '</td><td>' + num(l.wear, 2) + '</td><td>' + num(l.wear_end, 1) +
      '</td><td>' + num(l.tyre_temp, 0) + '</td><td>' + num(l.brake_temp, 0) + '</td><td>' + num(l.track_temp, 0) +
      '</td><td>' + (l.rain > 0.01 ? Math.round(l.rain * 100) + ' %' : '—') + '</td><td>' + l.place + '</td><td>' + (l.compound || '') + '</td></tr>';
  }).join('');

  $('detail').innerHTML =
    '<div class="top"><div><h2></h2><small></small></div><button id="del">Supprimer</button></div>' +
    '<div class="cards">' +
      card('Tours', laps.length) + card('Meilleur', lapTime(best)) + card('Moyenne', lapTime(mean)) +
      card('Régularité', sd == null ? '—' : '± ' + sd.toFixed(2), 's') +
      card('Carburant / tour', num(fuel, 2), 'L') + card('Énergie / tour', num(energy, 1), '%') + card('Usure pneus / tour', num(wear, 2), '%') +
    '</div>' +
    '<div class="charts">' +
      '<div class="panel chart"><h3>Temps au tour</h3><svg id="c1"></svg></div>' +
      '<div class="panel chart"><h3>Carburant par tour (L)</h3><svg id="c2"></svg></div>' +
      '<div class="panel chart"><h3>Usure des pneus (%)</h3><svg id="c3"></svg></div>' +
      '<div class="panel chart"><h3>Température des pneus (°C)</h3><svg id="c4"></svg></div>' +
    '</div>' +
    '<div class="panel tablewrap"><table><thead><tr><th>Tour</th><th>Temps</th><th>Carbu (L)</th><th>Énergie (%)</th><th>Usure/tour</th><th>Usure (%)</th><th>Pneus °C</th><th>Freins °C</th><th>Piste °C</th><th>Pluie</th><th>Pos.</th><th>Gomme</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  $('detail').querySelector('h2').textContent = s.track;
  $('detail').querySelector('small').textContent = (SESSION[s.type] || 'Session') + ' · ' + s.car + ' (' + s.class + ') · ' + day(s.started) + ' · ' + dur(s.started, s.ended);
  $('del').onclick = async () => {
    if (!confirm('Supprimer cette session et ses ' + laps.length + ' tours ?')) return;
    await fetch('/api/sessions/' + s.id, { method: 'DELETE' });
    current = null; $('detail').innerHTML = '<div class="empty panel">Session supprimée.</div>'; loadList();
  };
  line('c1', laps.map(l => l.valid && !l.pit ? l.time : null), { fmt: lapTime, best: true, color: 'var(--accent)' });
  line('c2', laps.map(l => l.fuel), { fmt: v => v.toFixed(3), color: 'var(--blue)' });
  line('c3', laps.map(l => l.wear_end), { fmt: v => v.toFixed(1), color: 'var(--ok)' });
  line('c4', laps.map(l => l.tyre_temp), { fmt: v => v.toFixed(0), color: 'var(--bad)' });
}

// Courbe SVG minimale : les valeurs absentes (null) cassent la ligne.
function line(id, values, o) {
  const svg = $(id), W = 400, H = 150, L = 54, R = 8, T = 8, B = 18;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const pts = values.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (!pts.length) { svg.innerHTML = '<text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle">pas de données</text>'; return; }
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = i => L + (values.length > 1 ? i / (values.length - 1) : 0.5) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let out = '';
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3, yy = y(v);
    out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)"/>' +
           '<text x="' + (L - 4) + '" y="' + (yy + 3) + '" text-anchor="end">' + o.fmt(v) + '</text>';
  }
  out += '<text x="' + L + '" y="' + (H - 4) + '">tour 1</text><text x="' + (W - R) + '" y="' + (H - 4) + '" text-anchor="end">tour ' + values.length + '</text>';
  let d = '', pen = false;
  values.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; });
  out += '<path d="' + d + '" fill="none" stroke="' + o.color + '" stroke-width="2"/>';
  const bestV = o.best ? Math.min(...pts.map(p => p[1])) : null;
  for (const [i, v] of pts) out += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="' + (v === bestV ? 4 : 2.2) + '" fill="' + (v === bestV ? 'var(--ok)' : o.color) + '"/>';
  svg.innerHTML = out;
}

loadList();
setInterval(() => { if (!document.hidden) loadList(); }, 10000);
</script>
</body>
</html>
