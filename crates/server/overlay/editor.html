<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaceWall · Éditeur d'overlays</title>
<link rel="stylesheet" href="/assets/overlay.css">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e9ef; --muted:#8b93a3; --accent:#ff7a1a; --ok:#3ecf8e; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6f8; --panel:#fff; --line:#dfe3ea; --text:#1b1f27; --muted:#6a7282; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,Segoe UI,sans-serif; }
  header { border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 8px 0 0; } h1 b { color:var(--accent); }
  nav a { color:var(--muted); text-decoration:none; margin-right:10px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:var(--panel); } .seg button.on { background:var(--accent); color:#111; font-weight:600; }
  button, select, input { font:inherit; color:var(--text); }
  button { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); } button.primary { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  .spacer { flex:1; } .status { color:var(--muted); font-size:13px; } .status.dirty { color:var(--accent); }
  .layout { display:grid; grid-template-columns:230px minmax(0,1fr) 270px; gap:14px; padding:14px; }
  @media (max-width:1100px) { .layout { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .panel h2 { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:600; }
  .panel h2:not(:first-child) { margin-top:16px; }
  .btnlist { display:flex; flex-direction:column; gap:6px; }
  .btnlist button { text-align:left; display:flex; justify-content:space-between; }
  .btnlist button.on { border-color:var(--accent); }
  .stage { position:relative; width:100%; max-width:calc((100vh - 130px) * 16 / 9); aspect-ratio:16/9; margin:0 auto; border-radius:10px; overflow:hidden; border:1px solid var(--line);
    background: linear-gradient(135deg,#1b2430,#0d1117 60%); }
  .stage .pw-root { position:absolute; inset:0; width:100%; height:100%; }
  .stage::after { content:""; position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px); background-size:5% 8.888%; }
  .field { margin:10px 0; } .field label { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:3px; }
  .field input[type=range], .field select { width:100%; }
  .field select { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px; }
  .check { display:flex; gap:8px; align-items:center; margin:10px 0; }
  .hint { color:var(--muted); font-size:12px; margin-top:10px; line-height:1.4; }
  code { background:rgba(127,127,127,.18); padding:1px 5px; border-radius:4px; font-size:12px; word-break:break-all; }
  .row { display:flex; gap:8px; margin-top:12px; } .row button { flex:1; }
  .danger:hover { border-color:#ef5350; color:#ef5350; }
</style>
</head>
<body>
<header>
  <h1>Pace<b>Wall</b></h1>
  <nav><a href="/">Données en direct</a><a href="/history">Historique</a><a href="/editor" style="color:var(--text)">Overlays</a></nav>
  <div class="seg" id="targets"><button data-t="player" class="on">Joueur</button><button data-t="obs">OBS</button></div>
  <div class="seg" id="modes"><button data-m="demo" class="on">Données démo</button><button data-m="live">Jeu en direct</button></div>
  <span class="spacer"></span>
  <span class="status" id="status">Enregistré</span>
  <button id="save" class="primary" disabled>Enregistrer</button>
</header>

<div class="layout">
  <aside class="panel">
    <h2>Ajouter un widget</h2>
    <div class="btnlist" id="palette"></div>
    <h2>Sur l'écran</h2>
    <div class="btnlist" id="onscreen"></div>
    <div class="row"><button id="copy">Copier vers <span id="other">OBS</span></button></div>
  </aside>

  <main>
    <div class="stage" id="stage"></div>
    <div class="hint" id="urlhint"></div>
  </main>

  <aside class="panel" id="inspector"></aside>
</div>

<script src="/assets/widgets.js"></script>
<script src="/assets/runtime.js"></script>
<script>
const $ = id => document.getElementById(id);
let layouts = { targets: {} }, target = 'player', view = null, selected = null, dirty = false;

const cur = () => (layouts.targets[target] ||= PW.defaultLayout());
const other = () => target === 'player' ? 'obs' : 'player';
const label = t => t === 'player' ? 'Joueur' : 'OBS';

function setDirty(v) {
  dirty = v;
  $('status').textContent = v ? 'Modifications non enregistrées' : 'Enregistré';
  $('status').className = 'status' + (v ? ' dirty' : '');
  $('save').disabled = !v;
}

function mountView() {
  if (view) view.destroy();
  view = PW.createView($('stage'), {
    layout: cur(), editing: true,
    onSelect: id => { selected = id; renderInspector(); renderOnScreen(); },
    onChange: () => { setDirty(true); renderInspector(); },
  });
  selected = null; renderInspector(); renderOnScreen(); renderHint();
  $('other').textContent = label(other());
}

function renderPalette() {
  $('palette').innerHTML = '';
  for (const [type, def] of Object.entries(PW.widgets)) {
    const b = document.createElement('button');
    b.innerHTML = '<span></span><span>＋</span>'; b.firstChild.textContent = def.name;
    b.onclick = () => {
      const n = cur().widgets.filter(w => w.type === type).length;
      let id = type + (n ? '-' + (n + 1) : '');
      while (cur().widgets.some(w => w.id === id)) id += 'x';
      cur().widgets.push({ id, type, x: 0.3, y: 0.3, scale: 1, opacity: 1, opts: {} });
      view.setLayout(cur()); view.select(id); setDirty(true);
    };
    $('palette').appendChild(b);
  }
}

function renderOnScreen() {
  $('onscreen').innerHTML = '';
  for (const w of cur().widgets) {
    const b = document.createElement('button');
    b.className = w.id === selected ? 'on' : '';
    b.textContent = (PW.widgets[w.type] || {}).name + (w.id !== w.type ? ' (' + w.id + ')' : '');
    b.onclick = () => view.select(w.id);
    $('onscreen').appendChild(b);
  }
}

function renderHint() {
  const base = location.origin + '/overlay/' + target;
  $('urlhint').innerHTML = target === 'obs'
    ? 'Source navigateur OBS (1920×1080) : <code>' + base + '</code><br>Un seul widget par source : <code>' + base + '?only=fuel</code>'
    : 'Fenêtre par-dessus le jeu (jeu en fenêtré ou sans bordure) : <code>' + base + '</code>';
}

function renderInspector() {
  const box = $('inspector');
  const w = cur().widgets.find(x => x.id === selected);
  if (!w) { box.innerHTML = '<h2>Réglages</h2><div class="hint">Clique un widget dans l\'aperçu pour le régler.<br><br>Glisse-le pour le déplacer.</div>'; return; }
  const def = PW.widgets[w.type];
  box.innerHTML = '<h2></h2>';
  box.firstChild.textContent = def.name;
  const slider = (name, key, min, max, step, fmt) => {
    const f = document.createElement('div'); f.className = 'field';
    f.innerHTML = '<label><span></span><b></b></label><input type="range">';
    const [span, val] = f.querySelectorAll('span,b'), input = f.querySelector('input');
    span.textContent = name; Object.assign(input, { min, max, step, value: w[key] }); val.textContent = fmt(w[key]);
    input.oninput = () => { w[key] = +input.value; val.textContent = fmt(w[key]); view.refresh(w.id); setDirty(true); };
    box.appendChild(f);
  };
  slider('Taille', 'scale', 0.5, 2.5, 0.05, v => Math.round(v * 100) + ' %');
  slider('Opacité', 'opacity', 0.1, 1, 0.05, v => Math.round(v * 100) + ' %');
  const opts = PW.resolveOpts(def, w.opts);
  for (const d of PW.optionDefs(def)) {
    const f = document.createElement('div');
    const set = v => { w.opts = { ...w.opts, [d.id]: v }; d.id === 'bg' ? view.refresh(w.id) : view.remount(); setDirty(true); };
    if (d.type === 'bool') {
      f.className = 'check'; f.innerHTML = '<input type="checkbox"><span></span>';
      f.firstChild.checked = !!opts[d.id]; f.lastChild.textContent = d.label;
      f.firstChild.onchange = e => set(e.target.checked);
    } else if (d.type === 'select') {
      f.className = 'field'; f.innerHTML = '<label><span></span></label><select></select>';
      f.querySelector('span').textContent = d.label;
      const s = f.querySelector('select');
      for (const [v, t] of d.choices) s.add(new Option(t, v, false, v === opts[d.id]));
      s.onchange = () => set(s.value);
    } else {
      f.className = 'field'; f.innerHTML = '<label><span></span><b></b></label><input type="range">';
      const val = f.querySelector('b'), i = f.querySelector('input');
      f.querySelector('span').textContent = d.label;
      Object.assign(i, { min: d.min, max: d.max, step: d.step, value: opts[d.id] }); val.textContent = opts[d.id];
      i.oninput = () => { val.textContent = i.value; set(+i.value); };
      i.onchange = () => { renderInspector(); };
    }
    box.appendChild(f);
  }
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = '<button id="dup">Dupliquer</button><button id="rm" class="danger">Supprimer</button>';
  box.appendChild(row);
  $('dup').onclick = () => {
    let id = w.id + '-copie'; while (cur().widgets.some(x => x.id === id)) id += '2';
    cur().widgets.push({ ...JSON.parse(JSON.stringify(w)), id, x: Math.min(0.9, w.x + 0.03), y: Math.min(0.9, w.y + 0.03) });
    view.setLayout(cur()); view.select(id); setDirty(true);
  };
  $('rm').onclick = () => { cur().widgets = cur().widgets.filter(x => x.id !== w.id); selected = null; view.setLayout(cur()); renderInspector(); renderOnScreen(); setDirty(true); };
  const hint = document.createElement('div'); hint.className = 'hint';
  hint.textContent = 'Position : ' + Math.round(w.x * 100) + ' % × ' + Math.round(w.y * 100) + ' %'; box.appendChild(hint);
}

$('targets').onclick = e => {
  const t = e.target.dataset.t; if (!t || t === target) return;
  target = t; [...$('targets').children].forEach(b => b.classList.toggle('on', b.dataset.t === t)); mountView();
};
$('modes').onclick = e => {
  const m = e.target.dataset.m; if (!m) return;
  [...$('modes').children].forEach(b => b.classList.toggle('on', b.dataset.m === m)); PW.feed.setMode(m);
};
$('copy').onclick = () => {
  if (!confirm('Remplacer la mise en page « ' + label(other()) + ' » par celle de « ' + label(target) + ' » ?')) return;
  layouts.targets[other()] = JSON.parse(JSON.stringify(cur())); setDirty(true);
};
$('save').onclick = async () => {
  $('save').disabled = true;
  const ok = await PW.saveLayouts({ version: 1, targets: layouts.targets });
  if (ok) setDirty(false); else { $('status').textContent = 'Échec de l\'enregistrement'; $('save').disabled = false; }
};
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  layouts = await PW.loadLayouts();
  renderPalette();
  PW.feed.setMode('demo');
  mountView();
})();
</script>
</body>
</html>
