<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaceWall · Overlay</title>
<link rel="stylesheet" href="/assets/overlay.css">
</head>
<body class="pw-page">
<script src="/assets/widgets.js"></script>
<script src="/assets/runtime.js"></script>
<script>
  // /overlay/player  : mise en page « joueur » (fenêtre par-dessus le jeu)
  // /overlay/obs     : mise en page « OBS » (source navigateur, fond transparent)
  // Options d'URL : ?only=fuel,tyres  (n'afficher que ces widgets)   ?demo=1  (données factices)
  const target = location.pathname.split('/').pop() === 'obs' ? 'obs' : 'player';
  const q = new URLSearchParams(location.search);
  const only = q.get('only') ? q.get('only').split(',') : null;
  let view;
  // Diagnostic de performance : ?flat=nomask,noclip
  for (const f of (q.get('flat') || '').split(',').filter(Boolean)) document.documentElement.classList.add('flat-' + f);

  async function load() {
    const layouts = await PW.loadLayouts();
    const layout = JSON.parse(JSON.stringify((layouts.targets && layouts.targets[target]) || PW.defaultLayout()));
    // ?opt=inputs.graph:false,fuel.energy:false : surcharge d'options (diagnostic, sans toucher à la mise en page)
    for (const o of (q.get('opt') || '').split(',').filter(Boolean)) {
      const [path, raw] = o.split(':'), [type, key] = path.split('.');
      const value = raw === 'true' ? true : raw === 'false' ? false : raw;
      layout.widgets.filter(w => w.type === type).forEach(w => { w.opts = { ...w.opts, [key]: value }; });
    }
    if (view) view.setLayout(layout);
    else view = PW.createView(document.body, { layout, only });
  }

  PW.feed.onLayout(load);          // l'éditeur vient d'enregistrer : on recharge la mise en page
  PW.feed.setMode(q.get('demo') ? 'demo' : 'live');
  load();
</script>
</body>
</html>
