[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "Serveur local PaceWall : lit LMU et diffuse les données en WebSocket"

[dependencies]
pwcore = { path = "../pwcore" }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "sync"] }
serde_json = "1"
