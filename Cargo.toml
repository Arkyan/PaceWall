[workspace]
resolver = "2"
members = ["crates/lmu", "crates/collector", "crates/fakegame", "crates/pwcore", "crates/server", "crates/pacewall"]

# La version de PaceWall, pour tous les crates. Modifiée par tools/release.ps1.
[workspace.package]
version = "0.9.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Le rendu logiciel (carte, widgets) est la partie chaude de l'overlay : vitesse plutôt que taille pour ces bibliothèques.
[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3
